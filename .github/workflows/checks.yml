name: regression checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: test-placeholder-not-a-real-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --group dev
      - run: uv run pytest backend/tests -q
      - run: uv run ruff check backend/src/takehome/services/review.py backend/src/takehome/web/routers/review.py backend/src/takehome/web/routers/workspace.py backend/src/takehome/web/routers/documents.py backend/src/takehome/web/routers/messages.py backend/src/takehome/web/routers/conversations.py backend/src/takehome/web/app.py
