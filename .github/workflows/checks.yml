name: regression checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orbital
          POSTGRES_PASSWORD: orbital
          POSTGRES_DB: orbital_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U orbital -d orbital_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ANTHROPIC_API_KEY: test-placeholder-not-a-real-key
      DATABASE_URL: postgresql+asyncpg://orbital:orbital@localhost:5432/orbital_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --group dev
      - run: uv run alembic upgrade head
      - run: uv run pytest backend/tests -q
      - run: uv run ruff check backend/tests/workflow_eval.py backend/tests/test_review.py backend/src/takehome/services/document.py alembic/versions/004_source_integrity.py backend/src/takehome/services/source_integrity.py backend/tests/test_source_integrity.py backend/src/takehome/services/brief.py backend/src/takehome/services/llm.py backend/tests/brief_fixture.py backend/tests/test_brief.py backend/tests/intent_eval.py backend/tests/agent_eval.py backend/tests/test_agent_evaluation.py alembic/env.py alembic/versions/003_workspace_revisions.py backend/tests/test_revision_history.py backend/src/takehome/services/review.py backend/src/takehome/web/routers/review.py backend/src/takehome/web/routers/workspace.py backend/src/takehome/web/routers/documents.py backend/src/takehome/web/routers/messages.py backend/src/takehome/web/routers/conversations.py backend/src/takehome/web/app.py
